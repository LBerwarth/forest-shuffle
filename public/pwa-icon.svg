<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#5e9669"/>
      <stop offset="0.6" stop-color="#3d6b4a"/>
      <stop offset="1" stop-color="#21381f"/>
    </radialGradient>
    <linearGradient id="cap" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a6d196"/>
      <stop offset="0.55" stop-color="#5c9468"/>
      <stop offset="1" stop-color="#34563a"/>
    </linearGradient>
    <linearGradient id="nut" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f7dca6"/>
      <stop offset="0.45" stop-color="#e2ab57"/>
      <stop offset="1" stop-color="#b3751f"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6238"/>
      <stop offset="1" stop-color="#4f3d20"/>
    </linearGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0e1f0d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e1f0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capshadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4f15" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7a4f15" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(106,70) scale(3.0)">
    <!-- grounding shadow -->
    <ellipse cx="50" cy="116" rx="26" ry="6" fill="url(#contact)"/>
    <!-- nut body -->
    <path d="M19,53 C17,82 31,107 50,115 C69,107 83,82 81,53 C81,53 66,57 50,57 C34,57 19,53 19,53 Z" fill="url(#nut)"/>
    <!-- specular highlight -->
    <ellipse cx="39" cy="76" rx="9" ry="15" fill="url(#spec)" transform="rotate(-18 39 76)"/>
    <!-- cap contact shadow cast on the nut -->
    <path d="M20,55 C34,60 66,60 80,55 L80,64 C66,70 34,70 20,64 Z" fill="url(#capshadow)"/>
    <!-- stem -->
    <rect x="45" y="2" width="10" height="20" rx="5" fill="url(#stem)"/>
    <!-- cap -->
    <path d="M13,52 C13,29 28,21 50,21 C72,21 87,29 87,52 C87,56 70,60 50,60 C30,60 13,56 13,52 Z" fill="url(#cap)"/>
    <!-- cap rim highlight -->
    <path d="M17,39 C30,30 70,30 83,39" stroke="#c8e6b8" stroke-width="2.4" fill="none" opacity="0.55" stroke-linecap="round"/>
    <!-- cap texture -->
    <path d="M15,48 C32,42 68,42 85,48" stroke="#2f5236" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
  </g>
</svg>
