<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#8A6A50"/>
  <g transform="translate(16,16)">
    <!-- Body -->
    <ellipse cx="1" cy="1" rx="7" ry="5" fill="white"/>
    <!-- Head -->
    <path d="M-6,-1 C-8,-2 -10,-1 -10,1 C-10,3 -8,4 -6,3Z" fill="white"/>
    <!-- Snout -->
    <ellipse cx="-10.5" cy="1" rx="2" ry="1.5" fill="white"/>
    <!-- Nostril -->
    <circle cx="-11" cy="0.5" r="0.5" fill="#8A6A50"/>
    <circle cx="-11" cy="1.5" r="0.5" fill="#8A6A50"/>
    <!-- Eye -->
    <circle cx="-7" cy="-0.5" r="0.7" fill="#8A6A50"/>
    <!-- Ear -->
    <path d="M-5,-3 C-6,-5 -4,-6 -3,-4Z" fill="white"/>
    <!-- Legs -->
    <path d="M-3,5.5 L-3,8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,6 L0,8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M4,5.5 L4,8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6.5,5 L6.5,8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M8,0 C9,-1 10,-2 10,-1" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
