<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#5E8A72"/>
  <g transform="translate(16,17)">
    <!-- Head -->
    <circle cx="0" cy="-7" r="2.5" fill="white"/>
    <!-- Body / thorax -->
    <ellipse cx="0" cy="-3.5" rx="3" ry="2" fill="white"/>
    <!-- Abdomen -->
    <ellipse cx="0" cy="2" rx="4.5" ry="5.5" fill="white"/>
    <!-- Wing line down center -->
    <line x1="0" y1="-2" x2="0" y2="7" stroke="#5E8A72" stroke-width="0.8" opacity="0.4"/>
    <!-- Antennae -->
    <path d="M-1.5,-9 C-3,-11 -5,-12 -6,-11" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M1.5,-9 C3,-11 5,-12 6,-11" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Left legs -->
    <path d="M-3,-4 L-6,-6" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M-4,0 L-7,-1" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M-4,4 L-7,5" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Right legs -->
    <path d="M3,-4 L6,-6" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M4,0 L7,-1" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M4,4 L7,5" stroke="white" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
