<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#5BAED6"/>
  <g transform="translate(16,16)">
    <!-- Body -->
    <ellipse cx="0" cy="1" rx="5.5" ry="4.5" fill="white"/>
    <!-- Head -->
    <circle cx="-3.5" cy="-3" r="3.5" fill="white"/>
    <!-- Beak -->
    <path d="M-7,-3 L-9,-2.5 L-7,-2" fill="white"/>
    <!-- Eye -->
    <circle cx="-4.5" cy="-3.5" r="0.7" fill="#5BAED6"/>
    <!-- Tail -->
    <path d="M5,0 L10,-2 L9,1 L10,3 L5,2Z" fill="white"/>
    <!-- Wing -->
    <path d="M-1,-1 C1,-3 4,-2 5,0 C4,1 1,2 -1,1Z" fill="#5BAED6" opacity="0.2"/>
    <!-- Leg 1 -->
    <path d="M-1,5 L-1,8 M-2.5,8 L-1,8 L0.5,8" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Leg 2 -->
    <path d="M1.5,5 L1.5,8 M0,8 L1.5,8 L3,8" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
