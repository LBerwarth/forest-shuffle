<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#6A8A78"/>
  <g transform="translate(16,16)">
    <!-- Body -->
    <ellipse cx="0" cy="2" rx="1.5" ry="4" fill="white"/>
    <!-- Head -->
    <circle cx="0" cy="-3" r="1.8" fill="white"/>
    <!-- Proboscis -->
    <path d="M0,-4.8 L0,-8" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Left wing -->
    <path d="M-1.5,0 C-4,-2 -8,-3 -10,-1 C-9,1 -5,1 -1.5,1Z" fill="white" opacity="0.85"/>
    <!-- Right wing -->
    <path d="M1.5,0 C4,-2 8,-3 10,-1 C9,1 5,1 1.5,1Z" fill="white" opacity="0.85"/>
    <!-- Legs -->
    <path d="M-1,1 L-4,4" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M1,1 L4,4" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M-1,3 L-3.5,6" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M1,3 L3.5,6" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M-1,5 L-3,8" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M1,5 L3,8" stroke="white" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>
