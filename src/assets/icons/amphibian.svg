<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#C2B8A8"/>
  <g transform="translate(16,16)">
    <!-- Body — curving S-shape -->
    <path d="M0,-9 C-2,-7 -3,-4 -2,-1 C-1,2 1,5 2,8 C2.5,10 2,11 1,12" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="0" cy="-10" rx="3" ry="2.5" fill="white"/>
    <!-- Eyes -->
    <circle cx="-2" cy="-11.5" r="1" fill="#C2B8A8"/>
    <circle cx="2" cy="-11.5" r="1" fill="#C2B8A8"/>
    <!-- Front left leg + toes -->
    <path d="M-2,-5 C-5,-6 -7,-7 -8,-6" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-8,-6 L-9.5,-7.5 M-8,-6 L-10,-5.5 M-8,-6 L-9,-4.5" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Front right leg + toes -->
    <path d="M-1,-3 C2,-4 5,-5 7,-4" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M7,-4 L8.5,-5.5 M7,-4 L9,-3.5 M7,-4 L8,-2.5" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Rear left leg + toes -->
    <path d="M0,3 C-3,3 -6,4 -7,5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-7,5 L-9,4 M-7,5 L-9,6 M-7,5 L-8,7" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Rear right leg + toes -->
    <path d="M2,6 C4,6 7,7 8,8" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M8,8 L10,7 M8,8 L10,9 M8,8 L9,10" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
