<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#C85070"/>
  <g transform="translate(16,16)">
    <!-- Body -->
    <ellipse cx="1" cy="1" rx="6" ry="4.5" fill="white"/>
    <!-- Head -->
    <ellipse cx="-5" cy="-1" rx="4" ry="3.5" fill="white"/>
    <!-- Snout -->
    <path d="M-9,-1 C-10,-0.5 -10.5,0 -10,0.5" stroke="white" stroke-width="2" fill="white" stroke-linecap="round"/>
    <!-- Left ear -->
    <ellipse cx="-6" cy="-5.5" rx="2.5" ry="3" fill="white"/>
    <!-- Right ear -->
    <ellipse cx="-2.5" cy="-5.5" rx="2.5" ry="3" fill="white"/>
    <!-- Ear inner -->
    <ellipse cx="-6" cy="-5.5" rx="1.5" ry="2" fill="#C85070" opacity="0.3"/>
    <ellipse cx="-2.5" cy="-5.5" rx="1.5" ry="2" fill="#C85070" opacity="0.3"/>
    <!-- Eye -->
    <circle cx="-6" cy="-1.5" r="0.8" fill="#C85070"/>
    <!-- Tail -->
    <path d="M7,0 C9,-1 10,-3 11,-4 C12,-5 12,-3 11,-1" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M-3,4.5 L-3,7" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0,5 L0,7" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M3,5 L3,7" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M5.5,4.5 L5.5,7" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
