<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#C8A060"/>
  <g transform="translate(16,17)">
    <!-- Body -->
    <ellipse cx="1" cy="2" rx="6" ry="4.5" fill="white"/>
    <!-- Head -->
    <ellipse cx="-5" cy="-1" rx="3.5" ry="3" fill="white"/>
    <!-- Left ear (long) -->
    <path d="M-6,-3.5 C-7,-7 -7.5,-10 -6.5,-12 C-5.5,-10 -5,-7 -4.5,-3.5" fill="white"/>
    <!-- Right ear (long) -->
    <path d="M-3.5,-3.5 C-4,-7 -3.5,-10 -2.5,-12 C-1.5,-10 -2,-7 -2,-3.5" fill="white"/>
    <!-- Eye -->
    <circle cx="-5.5" cy="-1.5" r="0.7" fill="#C8A060"/>
    <!-- Tail -->
    <circle cx="7" cy="0" r="2" fill="white"/>
    <!-- Hind leg -->
    <path d="M4,5 C5,7 6,8 7,7.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Front leg -->
    <path d="M-3,5 L-3,7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
